name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Python and model tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node tests/model.test.js
      - name: Repository safety checks
        run: bash tests/repository-check.sh
      - name: QML lint when Omarchy is available
        run: |
          if command -v qmllint >/dev/null && test -d /usr/share/omarchy/shell; then
            qmllint -I /usr/share/omarchy/shell BarWidget.qml Panel.qml Controller.qml components/*.qml
          else
            echo 'Omarchy shell not available on this runner; local validation covers QML.'
          fi
